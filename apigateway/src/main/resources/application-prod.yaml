spring:
  config:
    import: optional:file:/config/application.yml
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/catalog-service/**
              filters:
                - RewritePath=/catalog-service/(?<segment>.*), /$\{segment}
            - id: member-service
              uri: lb://MEMBER-SERVICE
              predicates:
                - Path=/member-service/api/v1/**, /member-service/v3/api-docs/**
              filters:
                - RewritePath=/member-service/(?<segment>.*), /$\{segment}
            - id: shop-service
              uri: lb://SHOP-SERVICE
              predicates:
                - Path=/shop-service/**
              filters:
                - RewritePath=/shop-service/(?<segment>.*), /$\{segment}
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order-service/**
              filters:
                - RewritePath=/order-service/(?<segment>.*), /$\{segment}
            - id: support-service
              uri: lb://SUPPORT-SERVICE
              predicates:
                - Path=/support-service/**
              filters:
                - RewritePath=/support-service/(?<segment>.*), /$\{segment}
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment-service/**
              filters:
                - RewritePath=/payment-service/(?<segment>.*), /$\{segment}
            - id: wallet-service
              uri: lb://WALLET-SERVICE
              predicates:
                - Path=/wallet-service/**
              filters:
                - RewritePath=/wallet-service/(?<segment>.*), /$\{segment}
            - id: batch-service
              uri: lb://BATCH-SERVICE
              predicates:
                - Path=/batch-service/**
              filters:
                - RewritePath=/batch-service/(?<segment>.*), /$\{segment}
          default-filters:
            - name: GlobalFilter
              args:
                preLogger: true
                postLogger: true
            - name: AuthenticationFilter
            - name: AuthorizationFilter
          discovery:
            locator:
              enabled: true

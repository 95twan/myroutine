apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-service-config
data:
  shop-service.yaml: |
    spring:
      datasource:
        url: ${SPRING_DATASOURCE_URL}
        driver-class-name: org.postgresql.Driver
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
      jackson:
        time-zone: Asia/Seoul
      sql:
        init:
          mode: always
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: true
        properties:
          hibernate:
            default_schema: shop
            format_sql: true
            jdbc:
              time_zone: Asia/Seoul
      kafka:
        bootstrap-servers: ${KAFKA_HOST}:9092
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        consumer:
          group-id: shop-service
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          auto-offset-reset: latest
          enable-auto-commit: false
          properties:
            spring.json.trusted.packages: "com.node5.common.event"
    
    api:
      v1: /api/v1
    
    management:
      endpoints:
        web:
          exposure:
            include: health
    
    server:
      port: 8085
    
    kafka:
      topics:
        shop-deleted: shop-service.shop-deleted.v1
        shop-registration-requested: shop-service.shop-registration-requested.v1
        shop-registration-completed: member-service.shop-registration-completed.v1
        shop-registration-failed: member-service.shop-registration-failed.v1
        shop-deletion-requested: shop-service.shop-deletion-requested.v1
        shop-deletion-completed: member-service.shop-deletion-completed.v1
        shop-deletion-failed: member-service.shop-deletion-failed.v1
        member-deleted: member-service.member-deleted.v1
